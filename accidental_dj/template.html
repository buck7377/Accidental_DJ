<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accidental DJ</title>
<style>
  :root {
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #0b0c0f;
    --panel: #14161b;
    --panel-2: #1a1d24;
    --line: #262a33;
    --line-strong: #333844;
    --ink: #e7e9ee;
    --ink-dim: #9aa1ae;
    --ink-faint: #6b7280;
    --focus: #7dd3fc;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
  }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }

  header h1 { font-size: 19px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--ink-dim); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin: 20px 0 0; border-bottom: 1px solid var(--line); }
  .tab {
    appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--ink-dim); font: inherit; font-weight: 500; padding: 9px 12px; cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--focus); }

  /* Controls */
  .controls {
    display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin: 16px 0;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .checkline { font-size: 12px; color: var(--ink-dim); }
  .field input[type="search"] {
    background: var(--panel-2); border: 1px solid var(--line-strong); color: var(--ink);
    font: inherit; padding: 7px 9px; border-radius: 7px; min-width: 240px;
  }
  .field input[type="search"]::placeholder { color: var(--ink-faint); }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row input[type="range"] { width: 180px; accent-color: var(--focus); }
  .slider-value { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 56px; }
  .checks { display: flex; flex-direction: column; gap: 7px; }
  .checkline { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .checkline input { accent-color: var(--focus); width: 15px; height: 15px; }
  .spacer { flex: 1 1 auto; }
  .count { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  button.reset {
    appearance: none; background: var(--panel-2); border: 1px solid var(--line-strong);
    color: var(--ink-dim); font: inherit; font-size: 12px; padding: 7px 11px;
    border-radius: 7px; cursor: pointer;
  }

  /* Tables */
  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; min-width: 720px; }
  th { text-align: left; padding: 0; background: var(--panel-2); border-bottom: 1px solid var(--line-strong); }
  th button {
    appearance: none; background: none; border: 0; color: var(--ink-dim); font: inherit;
    font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase;
    padding: 10px 12px; width: 100%; text-align: left; cursor: pointer; white-space: nowrap;
  }
  th button[aria-sort-active="true"] { color: var(--ink); }
  th.right button { text-align: right; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  td.right { text-align: right; }
  /* Let the title columns absorb the slack; everything else stays compact. */
  #t-table th:nth-child(n+3), #t-table td:nth-child(n+3),
  #a-table th:nth-child(n+4), #a-table td:nth-child(n+4) { width: 1%; white-space: nowrap; }
  .title { font-weight: 500; }
  .artist { color: var(--ink-dim); font-size: 12.5px; }
  .arrow { color: var(--ink-faint); padding: 0 2px; }
  .year, .bpm, .drift { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-faint); }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line-strong);
    color: var(--ink-dim); background: var(--panel-2); white-space: nowrap;
  }

  /* Camelot chips: hue = wheel position, lightness separates the A and B rings. */
  .cam {
    display: inline-block; min-width: 42px; text-align: center;
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
    padding: 3px 7px; border-radius: 6px; border: 1px solid;
  }
  .cam-pair { display: flex; align-items: center; gap: 6px; }

  details.legend { margin: 14px 0 0; }
  details.legend summary { color: var(--ink-dim); font-size: 12px; cursor: pointer; padding: 4px 0; }
  .legend-grid { display: flex; flex-wrap: wrap; gap: 5px; padding: 10px 0 2px; }

  .note {
    padding: 10px 2px 0; font-size: 12px; color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .empty { padding: 28px 16px; text-align: center; color: var(--ink-dim); }
  .empty strong { color: var(--ink); display: block; margin-bottom: 4px; font-weight: 600; }

  footer {
    margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line);
    color: var(--ink-faint); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px;
  }
  footer a { color: var(--ink-dim); }
  a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px;
  }
  [hidden] { display: none !important; }

  @media (max-width: 600px) {
    .wrap { padding: 16px 12px 48px; }
    .controls { gap: 12px; }
    .field input[type="search"] { min-width: 0; width: 100%; }
    .field { width: 100%; }
    .slider-row input[type="range"] { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Accidental DJ</h1>
    <p id="summary"></p>
  </header>

  <div class="tabs" role="tablist" aria-label="Views">
    <button class="tab" id="tab-transitions" role="tab" aria-selected="true"
            aria-controls="panel-transitions">Transitions</button>
    <button class="tab" id="tab-tracks" role="tab" aria-selected="false"
            aria-controls="panel-tracks">All tracks</button>
  </div>

  <details class="legend">
    <summary>Camelot color key</summary>
    <div class="legend-grid" id="legend"></div>
  </details>

  <!-- Transitions -->
  <section id="panel-transitions" role="tabpanel" aria-labelledby="tab-transitions">
    <div class="controls">
      <div class="field">
        <label for="t-search">Search title, artist or year</label>
        <input id="t-search" type="search" placeholder="e.g. 1968, Dolly, trap" autocomplete="off">
      </div>
      <div class="field">
        <label for="t-drift">Maximum tempo drift</label>
        <div class="slider-row">
          <input id="t-drift" type="range" min="0" max="100" value="100" step="1"
                 aria-describedby="t-drift-value">
          <span class="slider-value" id="t-drift-value"></span>
        </div>
      </div>
      <div class="checks">
        <label class="checkline"><input id="t-halfdouble" type="checkbox" checked>
          Include half &amp; double time</label>
        <label class="checkline"><input id="t-samekey" type="checkbox"> Same key only</label>
      </div>
      <div class="spacer"></div>
      <div class="count" id="t-count"></div>
      <button class="reset" id="t-reset" type="button">Reset filters</button>
    </div>

    <div class="table-scroll">
      <table id="t-table">
        <thead><tr id="t-head"></tr></thead>
        <tbody id="t-body"></tbody>
      </table>
    </div>
    <div class="note" id="t-note" hidden></div>
    <div class="empty" id="t-empty" hidden></div>
  </section>

  <!-- All tracks -->
  <section id="panel-tracks" role="tabpanel" aria-labelledby="tab-tracks" hidden>
    <div class="controls">
      <div class="field">
        <label for="a-search">Search title, artist or year</label>
        <input id="a-search" type="search" placeholder="e.g. 2017, Cash, 8A" autocomplete="off">
      </div>
      <div class="spacer"></div>
      <div class="count" id="a-count"></div>
    </div>
    <div class="table-scroll">
      <table id="a-table">
        <thead><tr id="a-head"></tr></thead>
        <tbody id="a-body"></tbody>
      </table>
    </div>
    <div class="note" id="a-note" hidden></div>
    <div class="empty" id="a-empty" hidden></div>
  </section>

  <footer>
    <span id="foot-meta"></span>
    <!-- Required attribution for the GetSongBPM API. Do not remove. -->
    <span>Tempo and key data from <a href="https://getsongbpm.com" rel="noopener">GetSongBPM</a>.</span>
  </footer>
</div>

<script id="payload" type="application/json">{{DATA}}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("payload").textContent);
  /* A big library can produce tens of thousands of pairs. Filtering and
     sorting always run over the whole set; only the rows put into the DOM
     are capped, so what you see is the top of the current order. */
  var RENDER_LIMIT = 500;
  var tracks = DATA.tracks, pairs = DATA.pairs, params = DATA.params;

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function num(value, digits) {
    return value == null || value === "" ? null : Number(value).toFixed(digits);
  }

  /* --- Camelot chips ------------------------------------------------
     Hue comes from the wheel position (12 numbers -> 12 hues) and
     lightness separates the A ring from the B ring, so compatible
     clusters read as one color family at a glance. */
  function camStyle(code) {
    var match = /^(\d{1,2})([AB])$/.exec(code || "");
    if (!match) return "";
    var hue = (parseInt(match[1], 10) - 1) * 30;
    if (match[2] === "A") {
      return "background:hsl(" + hue + " 58% 15%);color:hsl(" + hue + " 80% 74%);" +
             "border-color:hsl(" + hue + " 45% 30%)";
    }
    return "background:hsl(" + hue + " 62% 31%);color:hsl(" + hue + " 95% 92%);" +
           "border-color:hsl(" + hue + " 55% 46%)";
  }
  function camChip(code) {
    if (!code) return '<span class="cam muted" style="border-color:var(--line-strong)">—</span>';
    return '<span class="cam" style="' + camStyle(code) + '">' + esc(code) + "</span>";
  }

  var legend = document.getElementById("legend");
  var legendHtml = "";
  for (var n = 1; n <= 12; n++) {
    legendHtml += camChip(n + "A") + camChip(n + "B");
  }
  legend.innerHTML = legendHtml;

  /* --- Shared table machinery --------------------------------------- */
  function makeTable(config) {
    var head = document.getElementById(config.head);
    var body = document.getElementById(config.body);
    var empty = document.getElementById(config.empty);
    var note = document.getElementById(config.note);
    var countEl = document.getElementById(config.count);
    var sortKey = null, sortDir = 1;

    head.innerHTML = config.columns.map(function (col, i) {
      return '<th' + (col.right ? ' class="right"' : "") + ' aria-sort="none">' +
        '<button type="button" data-col="' + i + '">' + esc(col.label) + "</button></th>";
    }).join("");

    head.addEventListener("click", function (event) {
      var button = event.target.closest("button[data-col]");
      if (!button) return;
      var col = config.columns[Number(button.dataset.col)];
      if (sortKey === col.key) {
        sortDir = -sortDir;
      } else {
        sortKey = col.key;
        sortDir = col.descFirst ? -1 : 1;
      }
      render();
    });

    function render() {
      var rows = config.rows().filter(config.filter);
      if (sortKey) {
        var column = null;
        config.columns.forEach(function (col) { if (col.key === sortKey) column = col; });
        rows = rows.slice().sort(function (a, b) {
          var va = column.value(a), vb = column.value(b);
          var aNull = va == null || va === "", bNull = vb == null || vb === "";
          if (aNull && bNull) return 0;
          if (aNull) return 1;      /* blanks always sink */
          if (bNull) return -1;
          if (typeof va === "number" && typeof vb === "number") return (va - vb) * sortDir;
          return String(va).localeCompare(String(vb), undefined, { numeric: true }) * sortDir;
        });
      }

      head.querySelectorAll("th").forEach(function (th, i) {
        var col = config.columns[i];
        var active = col.key === sortKey;
        th.setAttribute("aria-sort", active ? (sortDir === 1 ? "ascending" : "descending") : "none");
        var button = th.querySelector("button");
        button.setAttribute("aria-sort-active", active ? "true" : "false");
        button.textContent = col.label + (active ? (sortDir === 1 ? "  ↑" : "  ↓") : "");
      });

      var shown = rows.length > RENDER_LIMIT ? rows.slice(0, RENDER_LIMIT) : rows;
      body.innerHTML = shown.map(config.row).join("");
      countEl.textContent = config.countText(rows.length);
      if (shown.length < rows.length) {
        note.textContent = "Showing the first " + shown.length.toLocaleString() +
          " of " + rows.length.toLocaleString() + " " + config.noun +
          ", in the order sorted above. Narrow the filters to see further down the list.";
        note.hidden = false;
      } else {
        note.hidden = true;
      }
      if (rows.length) {
        empty.hidden = true;
        document.getElementById(config.table).hidden = false;
      } else {
        empty.innerHTML = config.emptyHtml();
        empty.hidden = false;
        note.hidden = true;
        document.getElementById(config.table).hidden = true;
      }
    }
    return { render: render };
  }

  /* --- Transitions -------------------------------------------------- */
  var tSearch = document.getElementById("t-search");
  var tDrift = document.getElementById("t-drift");
  var tDriftValue = document.getElementById("t-drift-value");
  var tHalfDouble = document.getElementById("t-halfdouble");
  var tSameKey = document.getElementById("t-samekey");
  var maxTolerance = params.tolerance;

  function driftLimit() {
    return maxTolerance * (Number(tDrift.value) / 100);
  }
  function haystack(track) {
    return (track.t + " " + track.a + " " + (track.y == null ? "" : track.y) + " " +
            (track.cam || "")).toLowerCase();
  }
  var searchCache = tracks.map(haystack);

  var transitions = makeTable({
    table: "t-table", head: "t-head", body: "t-body",
    empty: "t-empty", count: "t-count", note: "t-note", noun: "matching transitions",
    columns: [
      { label: "From", key: "from", value: function (p) { return tracks[p.a].t; } },
      { label: "To", key: "to", value: function (p) { return tracks[p.b].t; } },
      { label: "Keys", key: "keys", value: function (p) { return tracks[p.a].cam; } },
      { label: "BPM", key: "bpm", right: true, value: function (p) { return tracks[p.a].bpm; } },
      { label: "Drift", key: "drift", right: true, value: function (p) { return p.drift; } },
      { label: "Match", key: "label", value: function (p) { return p.label || "straight"; } },
      { label: "Years", key: "years", right: true, value: function (p) { return tracks[p.a].y; } }
    ],
    rows: function () { return pairs; },
    filter: function (pair) {
      if (pair.drift > driftLimit() + 1e-9) return false;
      if (!tHalfDouble.checked && pair.label) return false;
      if (tSameKey.checked && !pair.same) return false;
      var query = tSearch.value.trim().toLowerCase();
      if (!query) return true;
      return query.split(/\s+/).every(function (term) {
        return searchCache[pair.a].indexOf(term) !== -1 ||
               searchCache[pair.b].indexOf(term) !== -1;
      });
    },
    row: function (pair) {
      var a = tracks[pair.a], b = tracks[pair.b];
      return "<tr>" +
        '<td><div class="title">' + esc(a.t) + '</div><div class="artist">' + esc(a.a) + "</div></td>" +
        '<td><div class="title"><span class="arrow">→</span> ' + esc(b.t) +
          '</div><div class="artist">' + esc(b.a) + "</div></td>" +
        '<td><div class="cam-pair">' + camChip(a.cam) + '<span class="arrow">→</span>' +
          camChip(b.cam) + "</div></td>" +
        '<td class="right bpm">' + num(a.bpm, 1) + '<span class="arrow"> → </span>' +
          num(b.bpm, 1) + "</td>" +
        '<td class="right drift">' + pair.drift.toFixed(2) + "%</td>" +
        "<td>" + (pair.label ? '<span class="badge">' + esc(pair.label) + "</span>"
                             : '<span class="muted">straight</span>') + "</td>" +
        '<td class="right year">' + (a.y == null ? "—" : esc(a.y)) +
          '<span class="arrow"> → </span>' + (b.y == null ? "—" : esc(b.y)) + "</td>" +
        "</tr>";
    },
    countText: function (shown) {
      return shown.toLocaleString() + " of " + pairs.length.toLocaleString() + " transitions";
    },
    emptyHtml: function () {
      if (!pairs.length) {
        return "<strong>No transitions found.</strong>" +
          "Re-run <code>build</code> with a wider <code>--tolerance</code>, or run " +
          "<code>enrich</code> to add tempo and key data for more tracks.";
      }
      return "<strong>Nothing matches these filters.</strong>" +
        "Widen the drift slider, clear the search box, or switch the toggles back on.";
    }
  });

  /* --- All tracks --------------------------------------------------- */
  var aSearch = document.getElementById("a-search");
  var allTracks = makeTable({
    table: "a-table", head: "a-head", body: "a-body",
    empty: "a-empty", count: "a-count", note: "a-note", noun: "tracks",
    columns: [
      { label: "Title", key: "title", value: function (t) { return t.t; } },
      { label: "Artist", key: "artist", value: function (t) { return t.a; } },
      { label: "Album", key: "album", value: function (t) { return t.al; } },
      { label: "Key", key: "cam", value: function (t) { return t.cam; } },
      { label: "BPM", key: "bpm", right: true, value: function (t) { return t.bpm; } },
      { label: "Sig", key: "sig", right: true, value: function (t) { return t.sig; } },
      { label: "Year", key: "year", right: true, value: function (t) { return t.y; } },
      { label: "Length", key: "dur", right: true, value: function (t) { return t.d; } },
      { label: "Pop.", key: "pop", right: true, descFirst: true, value: function (t) { return t.p; } }
    ],
    rows: function () { return tracks; },
    filter: function (track) {
      var query = aSearch.value.trim().toLowerCase();
      if (!query) return true;
      var text = searchCache[track.i] + " " + (track.al || "").toLowerCase();
      return query.split(/\s+/).every(function (term) { return text.indexOf(term) !== -1; });
    },
    row: function (track) {
      var minutes = track.d == null ? null : Math.floor(track.d / 60000);
      var seconds = track.d == null ? null : Math.floor((track.d % 60000) / 1000);
      return "<tr>" +
        '<td class="title">' + esc(track.t) + "</td>" +
        '<td class="artist">' + esc(track.a) + "</td>" +
        '<td class="artist">' + esc(track.al || "") + "</td>" +
        "<td>" + camChip(track.cam) + "</td>" +
        '<td class="right bpm">' + (track.bpm == null ? '<span class="muted">—</span>' : num(track.bpm, 1)) + "</td>" +
        '<td class="right num">' + (track.sig ? esc(track.sig) : '<span class="muted">—</span>') + "</td>" +
        '<td class="right year">' + (track.y == null ? '<span class="muted">—</span>' : esc(track.y)) + "</td>" +
        '<td class="right num">' + (minutes == null ? '<span class="muted">—</span>'
            : minutes + ":" + String(seconds).padStart(2, "0")) + "</td>" +
        '<td class="right num">' + (track.p == null ? '<span class="muted">—</span>' : esc(track.p)) + "</td>" +
        "</tr>";
    },
    countText: function (shown) {
      return shown.toLocaleString() + " of " + tracks.length.toLocaleString() + " tracks";
    },
    emptyHtml: function () {
      if (!tracks.length) {
        return "<strong>No tracks in the database.</strong>Run <code>sync</code> first.";
      }
      return "<strong>No tracks match that search.</strong>Try a shorter query.";
    }
  });

  /* --- Wiring ------------------------------------------------------- */
  function updateDriftLabel() {
    tDriftValue.textContent = driftLimit().toFixed(2) + "%";
  }
  /* Coalesce bursts of input events (a slider drag, fast typing) into one
     render per frame. */
  function throttle(render) {
    var frame = null;
    return function () {
      if (frame) return;
      frame = requestAnimationFrame(function () { frame = null; render(); });
    };
  }
  var renderTransitions = throttle(function () { transitions.render(); });
  var renderTracks = throttle(function () { allTracks.render(); });
  ["input", "change"].forEach(function (event) {
    tSearch.addEventListener(event, renderTransitions);
    tDrift.addEventListener(event, function () { updateDriftLabel(); renderTransitions(); });
    aSearch.addEventListener(event, renderTracks);
  });
  tHalfDouble.addEventListener("change", renderTransitions);
  tSameKey.addEventListener("change", renderTransitions);
  document.getElementById("t-reset").addEventListener("click", function () {
    tSearch.value = "";
    tDrift.value = 100;
    tHalfDouble.checked = true;
    tSameKey.checked = false;
    updateDriftLabel();
    transitions.render();
  });

  var tabs = [
    { tab: document.getElementById("tab-transitions"), panel: document.getElementById("panel-transitions") },
    { tab: document.getElementById("tab-tracks"), panel: document.getElementById("panel-tracks") }
  ];
  tabs.forEach(function (entry, index) {
    entry.tab.addEventListener("click", function () {
      tabs.forEach(function (other, otherIndex) {
        var selected = index === otherIndex;
        other.tab.setAttribute("aria-selected", selected ? "true" : "false");
        other.panel.hidden = !selected;
      });
    });
    entry.tab.addEventListener("keydown", function (event) {
      var next = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
      if (!next) return;
      event.preventDefault();
      tabs[(index + next + tabs.length) % tabs.length].tab.focus();
      tabs[(index + next + tabs.length) % tabs.length].tab.click();
    });
  });

  document.getElementById("summary").textContent =
    pairs.length.toLocaleString() + " transitions across " +
    params.enriched_count.toLocaleString() + " tracks with tempo and key (" +
    params.track_count.toLocaleString() + " liked songs synced)";
  document.getElementById("foot-meta").textContent =
    "Built " + DATA.generated_at + " · tolerance " + params.tolerance + "% · max " +
    params.max_per_track + " pairs per track · same-artist pairs " +
    (params.allow_same_artist ? "included" : "excluded") + ".";

  updateDriftLabel();
  transitions.render();
  allTracks.render();
})();
</script>
</body>
